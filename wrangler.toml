# ============================================
# Djuniors - Cloudflare Workers Configuration
# ============================================
#
# This file is read by `wrangler` CLI for both local dev (`wrangler dev`) and
# production deploys (`wrangler deploy`).
#
# Setup state
# -----------
# This file currently uses the placeholder IDs below (`<YOUR_*>`). To make
# deploys work, run `npm run setup:cf` which prints the exact commands you
# need to run, then paste the returned IDs back here.
#
# Free-tier limits targeted:
#   - 100k Workers req/day
#   - 5 GB D1 storage, 5M rows read/day
#   - 10 GB R2 storage, 1M Class A ops/mo, 10M Class B ops/mo
#   - 100k KV reads/day, 1k KV writes/day
#   - Unlimited Pages bandwidth

name = "djuniors-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Worker CPU limit (default 50ms on free; lowering caps runaway requests earlier
# and reduces CPU-billed time so we stay well under any pay-as-you-go threshold
# should the account one day graduate to a paid plan).
[limits]
cpu_ms = 10

# ============================================
# D1 Database
# ============================================
# To create: `wrangler d1 create djuniors-db`
# Then set database_name + replace database_id with the returned value.
[[d1_databases]]
binding = "DB"
database_name = "djuniors-db"
database_id = "<YOUR_D1_DATABASE_ID>" # → `wrangler d1 create djuniors-db`

# ============================================
# R2 Storage (file/media uploads)
# ============================================
# To create: `wrangler r2 bucket create djuniors-files`
[[r2_buckets]]
binding = "R2"
bucket_name = "djuniors-files"

# ============================================
# KV Namespace (sessions + cache version stamps)
# ============================================
# To create: `wrangler kv namespace create DJUNIORS_KV`
# Then replace id with the returned value.
[[kv_namespaces]]
binding = "KV"
id = "<YOUR_KV_NAMESPACE_ID>" # → `wrangler kv namespace create DJUNIORS_KV`

# ============================================
# Environment variables
# ============================================
# Non-secret defaults go here. Real secrets must be set per-environment with
# `wrangler secret put NAME` (see DEPLOY.md).
[vars]
WA_FONNTE_TOKEN = ""            # legacy — use secret instead (see [secrets] note below)
# Default JWT secret below is a placeholder generated by `openssl rand -base64 48`.
# In production, OVERRIDE via `wrangler secret put JWT_SECRET` with your own
# random value — never deploy with the default value.
JWT_SECRET = "tpw1NTflMv1yY248CI3T6FXCqF1b2MM4SNNw397OdED7X1s77wOQ2kad33zIe9l"
TURNSTILE_SECRET = ""           # legacy — use secret instead
TURNSTILE_SITE_KEY = ""         # site-visible key, safe in vars
# CORS allowlist. Uncomment in production and list every public origin:
#   ALLOWED_ORIGINS = "https://djuniors.id,https://www.djuniors.id,https://admin.djuniors.id"

# Secrets (set via `wrangler secret put NAME`):
#   - WA_FONNTE_TOKEN  : Fonnte.io API token (for WhatsApp notifications)
#   - JWT_SECRET       : signing key for admin/user JWTs (rotate periodically)
#   - TURNSTILE_SECRET : Cloudflare Turnstile server-side secret

# ============================================
# Environments
# ============================================
# - `production` is the live deploy target (`wrangler deploy` goes here)
# - `staging` is optional; useful for pre-production smoke tests
#
# To deploy: `wrangler deploy` → uses [env.production] section.
# `wrangler dev` always uses local .dev.vars + miniflare (no env-specific vars).

[env.production]
vars = { ENVIRONMENT = "production" }
# name override optional:
# name = "djuniors-api"

[env.staging]
vars = { ENVIRONMENT = "staging" }

# ============================================
# Cron Triggers (Task: dashboard snapshots)
# ============================================
# Daily snapshot generation at 02:00 UTC (09:00 WIB) — pre-aggregates the
# dashboard stats into `dashboard_snapshots` so the admin dashboard reads
# 1 small table instead of running GROUP BY over all registrations.
# The `scheduled` handler is exported from src/index.ts.
[triggers]
crons = ["0 2 * * *"]
