<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/images/favicon/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/images/favicon/favicon-32.png" sizes="32x32" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/images/favicon/favicon-dark-32.png" sizes="32x32" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="/images/favicon/favicon-192.png" sizes="192x192" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/images/favicon/favicon-dark-192.png" sizes="192x192" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="/images/favicon/site.webmanifest">
    <meta name="theme-color" content="#0EA5E9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#EC4899" media="(prefers-color-scheme: dark)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djuniors Learning Center — Admin Dashboard</title>
    <!-- Self-hosted fonts (Task G). The @font-face declarations live in src/index.css
         and reference /fonts/* which Vite copies from dashboard/public/fonts/ to
         the build output's public path. The preload below hints the browser to fetch
         the heading font during CSS parse so it's ready by paint. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/baloo2-latin.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/nunito-latin.woff2">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
